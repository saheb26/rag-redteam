[project]
name = "rag-redteam"
version = "0.1.0"
description = "Open-source RAG prompt injection scanner for retrieval-augmented generation pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "saheb26" }]
keywords = [
    "rag",
    "prompt-injection",
    "llm-security",
    "red-team",
    "owasp",
    "vector-database",
    "langchain",
    "ai-security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/saheb26/rag-redteam"
Repository = "https://github.com/saheb26/rag-redteam"
Issues = "https://github.com/saheb26/rag-redteam/issues"
Documentation = "https://github.com/saheb26/rag-redteam#readme"
"Enterprise hardening" = "https://counselnode.com"

[project.scripts]
rag-redteam = "rag_redteam.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_redteam"]
